[project]
name = "whygraph"
version = "0.1.0"
description = "A decision graph for coding agents: why a file is the way it is, who owns it, what changes with it. Built on the Relate embedded graph database."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["relate-db>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whygraph = "whygraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
